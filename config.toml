# GHNoti config: notification groups, keyed by group name.
# "authors" are GitHub account names, "repos" are full names like
# "owner/repo" — either or both; both means a notification must match
# both filters. Matching is case-insensitive.
#
# The special group "__all__" (every notification, unfiltered) is always
# available; the groups below are yours and are cycled with CTRL+h / CTRL+l.

[theme]
# One flat table: element -> style string. A style is any mix of a color
# ("default", "black"…"white", "bright-*", or hex "#rrggbb"/"#rgb" — hex is
# snapped to the nearest of the terminal's 256 palette entries),
# "on <color>" for the background, and formats (bold, dim, reverse,
# underline, italic, blink, standout). Unset elements keep the defaults.
# The defaults are tuned for dark terminals; "read" is deliberately dimmer
# than "unread" so the two never blur together.

title    = "bold reverse"           # top bar + spinner
header   = "bold"                   # column labels
unread   = "default bold"           # rows of unread notifications
read     = "bright-black"           # read ones: greyed out
selected = "bold reverse"           # the row under the cursor
footer   = "reverse"                # key hints
empty    = "dim"                    # "(no notifications in this group)"
popup    = "bold reverse"           # error messages
# background = "default"            # screen background; must be a single color
# text       = "default"            # misc lines (the group-counts footer)

[groups.CoreTeam]
authors = ["torvalds", "gregkh"]

[groups.Friends]
authors = ["octocat", "gaearon"]

[groups.Kernel]
repos = ["torvalds/linux"]

[groups.React]
repos = ["facebook/react", "facebook/react-native"]
authors = ["gaearon", "sebmarkbage"]
